services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes: ["orders-data:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U orders"]
      interval: 5s
      retries: 15
  app:
    build: .
    ports: ["127.0.0.1:18091:8080"]
    environment:
      DB_URL: jdbc:postgresql://db:5432/orders
      DB_USER: orders
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      APP_RELEASE: ${APP_RELEASE:?Set immutable APP_RELEASE}
      SENTRY_DSN: ${SENTRY_DSN:-}
      DEMO_RUN: ${DEMO_RUN:-manual}
    depends_on:
      db: {condition: service_healthy}
volumes:
  orders-data:
